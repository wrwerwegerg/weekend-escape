<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周末出逃</title><style>body{margin:0;background:radial-gradient(circle at top,#7953dc,transparent 42%),#15141d;color:white;font:16px Arial,"PingFang SC"}.app{max-width:520px;min-height:100vh;margin:auto;padding:24px 18px;box-sizing:border-box}h1{font-size:42px;line-height:1.05;margin:62px 0 15px}.muted{color:#d8d3e1;line-height:1.7}.box{padding:22px;margin-top:25px;border:1px solid #ffffff2e;background:#ffffff12;border-radius:26px}.btn,.pick{width:100%;padding:16px;margin-top:12px;border-radius:16px;border:0;font-size:16px;font-weight:bold}.btn{background:#ebd9ff;color:#2b1d38}.pick{background:#ffffff12;color:#fff;border:1px solid #ffffff2d;text-align:left}.on{background:#ead8ff;color:#291c36}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}.card{padding:22px;border-radius:26px;background:#ffffff14;border:1px solid #ffffff2d}.title{font-size:30px;font-weight:900;margin:12px 0}.route{border-left:2px solid #d9b8ff;padding-left:16px;margin:20px 0}.node{margin:0 0 18px}.note{font-size:12px;background:#0004;padding:12px;border-radius:12px}</style><main class="app"><b>WEEKEND ESCAPE · 模拟体验</b><section id="a"><h1>周末，<br>先逃一会。</h1><p class="muted">不赶路，不打卡。选一个状态，生成一段轻盈的周末出逃。</p><div class="box"><b>全部为模拟体验</b><p class="muted">不连接定位、天气或真实商家数据。</p><button class="btn" onclick="go(1)">开始出逃 →</button></div></section><section id="b" class="hide"><h1>现在的你，<br>需要什么？</h1><div id="m" class="grid"><button class="pick on">慢下来</button><button class="pick">透透气</button><button class="pick">见见人</button><button class="pick">一个人待着</button></div><button class="btn" onclick="go(2)">下一步</button></section><section id="c" class="hide"><h1>给一点<br>时间就好。</h1><div id="t" class="grid"><button class="pick on">半天</button><button class="pick">一整天</button><button class="pick">低预算</button><button class="pick">随意一点</button></div><button class="btn" onclick="result()">生成我的计划 ✦</button></section><section id="d" class="hide"><div class="card"><small>为你模拟生成 · 可自由调整</small><div id="ttl" class="title">把时间还给自己</div><p id="intro" class="muted"></p><div class="route"><div class="node"><b>10:30 · 慢慢出门</b><br><small>带一杯喜欢的饮料，关闭待办清单。</small></div><div class="node"><b>13:00 · 留白散步</b><br><small>选一条不必拍照的路，走到想停为止。</small></div><div class="node"><b>16:30 · 温柔收尾</b><br><small>写下一件没完成、但没关系的事。</small></div></div><div class="note">✦ 模拟路线预览，不是地图、导航或真实地点推荐。</div><button class="btn" onclick="result()">换一份计划</button></div></section></main><script>let mood="慢下来",time="半天",n=0;function s(id,f){document.querySelectorAll("#"+id+" .pick").forEach(a=>a.onclick=()=>{document.querySelectorAll("#"+id+" .pick").forEach(b=>b.classList.remove("on"));a.classList.add("on");f(a.textContent)})}s("m",a=>mood=a);s("t",a=>time=a);function go(q){["a","b","c","d"].forEach((a,i)=>document.getElementById(a).classList.toggle("hide",i!=q));scrollTo(0,0)}function result(){let a=[["把时间还给自己","今天的重点，是把节奏从必须调回愿意。"],["城市边缘的呼吸","去远离屏幕的角落，让身体先抵达周末。"],["低耗能的好天气","不追景点，只收集舒服的光线和声音。"]][n++%3];ttl.textContent=a[0];intro.textContent=mood+"的你，适合一份"+time+"、"+a[1];go(3)}</script>
